<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 哔哩哔哩视频数据分析系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="login-body">
  <main class="card login-card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <p class="eyebrow">大数据开发综合实践</p>
      <h1 class="h3 mb-2">登录系统</h1>
      <p class="text-secondary mb-4">基于哔哩哔哩视频数据的数据分析与 AI 知识库系统</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="username">用户名</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">密码</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">登录</button>
      </form>
      <p class="demo-account mt-4 mb-0">演示账号：admin / admin123；user / user123</p>
    </div>
  </main>
</body>
</html>
