<form method="get" class="card card-body mb-4">
  <div class="row g-2 align-items-end">
    <div class="col-sm-6 col-lg-4">
      <label class="form-label" for="business-date">业务日期（publish_time）</label>
      <input class="form-control" id="business-date" name="date" type="date" value="{{ selected_date }}" required>
    </div>
    <div class="col-auto"><button class="btn btn-outline-primary" type="submit">查询</button></div>
    <div class="col-12"><span class="text-secondary small">当前选择日期：{{ selected_date }}</span></div>
  </div>
</form>
